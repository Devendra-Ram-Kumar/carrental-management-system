
services:
  db:
    image: mysql:8.0
    container_name: carrent-db1
    restart: always
    environment:
      MYSQL_DATABASE: carrent
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3308:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - carerent-net

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: carrent-backend1
    restart: always
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/carrent
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    depends_on:
      - db
    ports:
      - "5822:8081"
    networks:
      - carrent-net

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: carrent-frontend1
    restart: always
    ports:
      - "3308:80"
    depends_on:
      - backend
    networks:
      - carrent-net

volumes:
  db_data:

networks:
  ecommerce-net:
    driver: bridge
